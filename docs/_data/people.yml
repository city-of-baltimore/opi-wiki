# Organization data for OPI Foundations.
#
# Single source for the org chart and the Team and Roles table. It holds City
# staff names, working titles, team identifiers and leads, reporting relationships,
# each team's high-level purpose, and a one-line summary of what each role does.
# Contractors do not appear here.
#
# Additional sensitive personnel or employment fields must never be added:
# payroll identifiers, phone numbers, email addresses, classifications, cost
# centers, personnel status, and full position descriptions live in City systems
# or SharePoint. The organization loader accepts only the exact fields demonstrated
# below and rejects every other field in hosted CI, before the site can build.
#
# Open (unfilled) City roles use the name "Open" so they show in the structure
# without implying a current incumbent.
#
# The four primary_value descriptions are retained verbatim from the team summary
# removed in commit ee27304. They are not currently rendered. Keep them unchanged
# until the Executive Director/CDO decides whether to restore, move, or retire them.

mayor:
  name: Brandon M. Scott
  title: Mayor

city_administrator:
  name: Faith P. Leach
  title: City Administrator

executive_director:
  name: Dartanion Swift-Williams
  title: Executive Director and Chief Data Officer
  summary: Sets OPI's strategy, standards, and priorities, and leads the City's performance, data, innovation, and cross-agency delivery agenda.

portfolios:
  - key: directors-office
    primary_value: Keeps work prioritized, documented, communicated, and deliverable.
    lead:
      name: Rakeim Young
      title: Chief of Staff
      summary: Leads AdminOps, officewide planning, governance, communications, and fiscal, human-resources, and facilities coordination.
    staff:
      - name: Roberto Herbruger
        title: Technical Program Manager
        summary: Coordinates roadmaps, requirements, risks, testing, and delivery across OPI's products and projects.
      - name: Mallory Screws
        title: Project Manager
        summary: Maintains delivery plans, coordinates dependencies, and keeps commitments, risks, and follow-up visible.
      - name: Audrey Randazzo
        title: Partnerships and Storytelling Lead
        summary: Builds OPI's partnerships and turns the office's data and work into clear information, briefings, and accessible communications for residents and City leaders.

  - key: performance
    primary_value: Owns the performance method; translates priorities into measures, follow-up, and improvement.
    lead:
      name: Danny Heller
      title: Deputy Chief Performance Officer
      summary: Leads monitoring of the Mayor's Action Plan implementation, agency performance plans, and CitiStat operations.
    staff:
      - name: Darren Lu
        title: CitiStat Program Manager
        summary: Manages the CitiStat method, session cycle, quality assurance, and analyst coaching.
      - name: Open
        title: Senior Performance Analyst
        summary: Leads citywide performance measures, agency performance plans, and performance management products.
      - name: Ethan Buckborough
        title: CitiStat Analyst
        summary: Analyzes agency performance, prepares decision-focused sessions, and tracks follow-through.
      - name: Nelson Gomes
        title: CitiStat Analyst
        summary: Analyzes agency performance, prepares decision-focused sessions, and tracks follow-through.
      - name: Ross Hackett
        title: CitiStat Analyst
        summary: Analyzes agency performance, prepares decision-focused sessions, and tracks follow-through.
      - name: "Griffin Riddler, PhD"
        title: CitiStat Analyst
        summary: Analyzes agency performance, prepares decision-focused sessions, and tracks follow-through.
      - name: Rashaad Tillery
        title: CitiStat Inspector
        summary: Inspects service delivery in the field to check reported results and surface issues the data doesn't show, and documents conditions on the ground.

  - key: data-and-analytics
    primary_value: Builds trusted data infrastructure and decision-ready analytics; supports CitiStat, transparency, agency operations, and AI readiness.
    lead:
      name: "Jason Howard, PhD"
      title: Deputy Chief Data Officer
      summary: Leads citywide data strategy, infrastructure, analytics, open data, governance, and responsible AI readiness.
    staff:
