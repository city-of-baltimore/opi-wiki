  - key: innovation-lab
    primary_value: Turns service problems into designed, usable, testable solutions; coordinates handoff to data, engineering, agency, or BCIT partners.
    lead:
      name: Gabriel Watson
      title: Innovation Program Manager
      summary: Leads service design, product discovery, prototyping, digital product development, delivery partnerships, and sustainment planning.
    staff:
      - name: Chiemeka Okeoma
        title: Applied Data Scientist
        summary: Uses analysis and rapid prototyping to help the Lab test solutions and turn evidence into usable products.
      - name: Derek Thomas
        title: Operations Analyst
        summary: Supports public safety and operations projects with discovery, project coordination, process analysis, documentation, and implementation follow-through.
      - name: Selenea Gibson
        title: Civic Designer
        summary: Conducts user research and turns findings into accessible journeys, service blueprints, prototypes, products, and recommendations.
      - name: Xander Jake de los Santos
